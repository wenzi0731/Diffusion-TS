run:
  name: diffusionts_joint
  seed: 42
  device: auto
  output_root: experiments/baseline4
data:
  energy_path: Data/CN03_energy_cleaned.csv
  weather_path: Data/weather_cleaned.csv
  weather_feature_set: pv10
  seq_len: 24
  num_workers: 0
model:
  d_model: 96
  encoder_layers: 4
  decoder_layers: 3
  heads: 4
  mlp_hidden_times: 4
  dropout: 0.0
  fourier_weight: null  # upstream default sqrt(24)/5
diffusion:
  timesteps: 1000
  sampling_steps: 100
training:
  epochs: 300
  batch_size: 32
  learning_rate: 0.00005
  betas: [0.9, 0.96]
  gradient_clip: 1.0
  ema_decay: 0.995
  val_every: 5
  early_stopping_patience: 12
evaluation:
  batch_size: 8
  sample_chunk_size: 128
  val_scenarios: 20
  test_scenarios: 100
  precision_recall_k: 5
  max_precision_samples: 10000
